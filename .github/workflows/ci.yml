name: CI

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'Dockerfile'
      - '.github/workflows/**'
env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/gitops-demo-app
  CONFIG_REPO: ${{ github.repository_owner }}/gitops-demo-config

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout app repo
        uses: actions/checkout@v4

      - name: Set image tag (short commit SHA)
        id: vars
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: docker build -t "$IMAGE:${{ steps.vars.outputs.tag }}" .

      - name: Push image
        run: docker push "$IMAGE:${{ steps.vars.outputs.tag }}"

      - name: Checkout config repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CONFIG_REPO }}
          token: ${{ secrets.CONFIG_REPO_TOKEN }}
          path: config

      - name: Update image tag in config repo
        run: |
          cd config
          sed -i "s|^  tag: .*|  tag: \"${{ steps.vars.outputs.tag }}\"|" charts/demoapp/values.yaml
          git config user.name  "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add charts/demoapp/values.yaml
          git commit -m "deploy: gitops-demo-app ${{ steps.vars.outputs.tag }}" || echo "no changes"
          git push
